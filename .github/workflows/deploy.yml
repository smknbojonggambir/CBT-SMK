name: Deploy CBT SMKN Bojonggambir

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verify Codebase
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔍 Linter & TypeScript Check
        run: npm run lint

      - name: 🏗️ Build Production Bundle (Vite)
        run: npm run build

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-cbt-smknbojonggambir
          path: dist/
